name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck bin/vcp test/test.sh install.sh uninstall.sh
      - name: tests (fake vercel, no network)
        run: sh test/test.sh
