<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0}
body{width:1200px;height:630px;background:#0c1220;color:#e6ebf5;font-family:ui-monospace,"SF Mono",Menlo,monospace;position:relative;overflow:hidden}
.b{position:absolute;inset:0;border:2px solid #25314f;border-radius:0}
.logo{position:absolute;left:72px;top:64px;font-size:44px;font-weight:700;letter-spacing:-.02em}
h1{position:absolute;left:72px;top:190px;width:880px;margin:0;font-size:78px;line-height:1.08;letter-spacing:-.04em;font-weight:700}
.chips{position:absolute;left:72px;bottom:72px;display:flex;gap:16px;font-size:26px}
.chip{border:2px solid currentColor;border-radius:99px;padding:6px 22px}
.p{color:#62c9ff}.w{color:#ffb454}.c{color:#b9a0ff}
.url{position:absolute;right:72px;bottom:80px;font-size:26px;color:#97a3bf}
</style></head><body><div class="b"></div>
<div class="logo">vcp</div>
<h1>Switch between Vercel accounts without logging out.</h1>
<div class="chips"><span class="chip p">personal</span><span class="chip w">work</span><span class="chip c">client</span></div>
<div class="url">vcp-cli.vercel.app</div>
</body></html>
